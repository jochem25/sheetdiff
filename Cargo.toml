[workspace]
resolver = "2"
members = ["crates/sheetdiff-core", "crates/sheetdiff-cli", "crates/sheetdiff-ui"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Kolthof Bouwadvies"]

[workspace.dependencies]
sheetdiff-core = { path = "crates/sheetdiff-core" }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe", "image_latest"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
regex = "1"
tracing = "0.1"
toml = "0.9"
clap = { version = "4.5", features = ["derive"] }
lopdf = "0.45"
rust_xlsxwriter = "0.99"
insta = { version = "1.43", features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
